name: Build APK

on:
  push:
    branches: ["main", "fix/**", "feat/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Chaves de CI (debug e upload)
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -keystore my-upload-key.jks -storepass ci-spritexp -keypass ci-spritexp \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SpriteXP,O=SpriteXP,C=BR"

      - name: Testes unitários
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: APK de release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ci-spritexp
          KEY_PASSWORD: ci-spritexp
        run: gradle :app:assembleRelease --no-daemon

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/SpriteXP-${{ github.run_number }}.apk

      - name: Artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: SpriteXP-apk
          path: dist/*.apk

      - name: Publicar release (branch main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SpriteXP v1.0.${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: true
