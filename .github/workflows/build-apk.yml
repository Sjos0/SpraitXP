name: Build APK

on:
  push:
    branches: ["main", "fix/**", "feat/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Chave de debug
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Chave de release (estável, vem dos secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SPRITEXP_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/spritexp-release.jks"

      - name: Testes unitários
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: APK de release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/spritexp-release.jks
          STORE_PASSWORD: ${{ secrets.SPRITEXP_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SPRITEXP_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/SpriteXP-${{ github.run_number }}.apk

      - name: Artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: SpriteXP-apk
          path: dist/*.apk

      - name: Publicar release (branch main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SpriteXP v1.0.${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: true
